<!DOCTYPE html>
<html lang="hr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerija – LEGO klub Zagreb</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="banner">
            <img src="slike/lego_banner.jpg" alt="LEGO banner">
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Početna</a></li>
                <li><a href="index.html#o-nama">O nama</a></li>
                <li><a href="index.html#radionice">Radionice</a></li>

                <li>
                    <a href="https://www.lego.com" target="_blank">
                        LEGO službena stranica
                    </a>
                </li>
            </ul>
        </nav>

    </header>

    <main>

        <section class="lego-gallery">

            <h2>Galerija LEGO setova</h2>

            <p>Ovdje možete vidjeti nekoliko LEGO setova iz naše kolekcije.</p>

            <div class="lego-gallery-grid">

                <figure class="gallery-item" data-set="city">

                    <img src="slike/city1.jpg" alt="LEGO City policijska postaja">

                    <figcaption>
                        LEGO City policijska postaja
                    </figcaption>

                </figure>

                <figure class="gallery-item" data-set="technic">

                    <img src="slike/technic1.jpg" alt="LEGO Technic automobil">

                    <figcaption>
                        LEGO Technic automobil
                    </figcaption>

                </figure>

                <figure class="gallery-item" data-set="friends">

                    <img src="slike/friends1.jpg" alt="LEGO Friends kafić">

                    <figcaption>
                        LEGO Friends kafić
                    </figcaption>

                </figure>

                <figure class="gallery-item" data-set="city">

                    <img src="slike/city2.jpg" alt="LEGO City vatrogasna postaja">

                    <figcaption>
                        LEGO City vatrogasna postaja
                    </figcaption>

                </figure>

                <figure class="gallery-item" data-set="technic">

                    <img src="slike/technic2.jpg" alt="LEGO Technic helikopter">

                    <figcaption>
                        LEGO Technic helikopter
                    </figcaption>

                </figure>

                <figure class="gallery-item" data-set="friends">

                    <img src="slike/friends2.jpg" alt="LEGO Friends kuća">

                    <figcaption>
                        LEGO Friends kuća
                    </figcaption>

                </figure>

            </div>

        </section>

    </main>

    <footer>
        &copy; Dino Spudic
    </footer>

</body>

</html>
