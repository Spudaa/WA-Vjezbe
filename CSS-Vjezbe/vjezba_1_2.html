<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Moja prva stranica – Header</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        header {
            background-color: white;
            border: 1px solid #ccc;
            margin: 10px;
            padding: 5px;
        }

        .banner img {
            width: 100%;
            display: block;
        }

        nav {
            background-color: #333;
            padding: 10px;
            margin-top: 5px;
            text-align: center;
        }

        nav ul {
            list-style: none;
        }

        nav li {
            display: inline-block;
            margin: 5px;
        }

        nav a {
            text-decoration: none;
            color: white;
            border: 1px solid #999;
            padding: 5px 10px;
            font-size: 14px;
        }

        main {
            background-color: white;
            margin: 10px;
            padding: 15px;
        }

        footer {
            background-color: #ddd;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <header>
        <div class="banner">
            <img src="lego_banner.jpg" alt="LEGO banner">
        </div>

        <nav class="main-nav">
            <ul>
                <li><a href="#">Početna</a></li>
                <li><a href="#">O nama</a></li>
                <li><a href="#">Radionice</a></li>
                <li><a href="#">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <p>Ovdje će ići ostatak sadržaja stranice.</p>
    </main>

    <footer>
        &copy; Dino Spudic
    </footer>

</body>
</html>
