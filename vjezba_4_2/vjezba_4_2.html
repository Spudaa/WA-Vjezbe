<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Vježba 12</title>
</head>
<body>

<h1>Kontakt forma</h1>

<form action="upload.php" method="post">

    <label for="ime">Ime *</label><br>
    <input type="text" id="ime" name="ime"
           placeholder="Unesite ime" required>
    <br><br>

    <label for="prezime">Prezime *</label><br>
    <input type="text" id="prezime" name="prezime"
           placeholder="Unesite prezime" required>
    <br><br>

    <label for="email">E-mail *</label><br>
    <input type="email" id="email" name="email"
           placeholder="Unesite e-mail" required>
    <br><br>

    <label for="drzava">Država</label><br>
    <select id="drzava" name="drzava">
        <option value="">Odaberite državu</option>
        <option value="HR" selected>Hrvatska</option>
        <option value="SI">Slovenija</option>
        <option value="DE">Njemačka</option>
        <option value="AT">Austrija</option>
    </select>
    <br><br>

    <label for="poruka">Poruka</label><br>
    <textarea id="poruka" name="poruka"
              rows="5" cols="30"
              placeholder="Napišite poruku"></textarea>
    <br><br>

    <input type="submit" value="Pošalji">
    <input type="reset" value="Poništi">

</form>

</body>
</html>
